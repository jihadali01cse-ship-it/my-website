<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Admin Password | Jihad Website</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            padding: 20px;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #172033, #00a8cc);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .reset-box {
            width: 100%;
            max-width: 430px;
            padding: 35px;
            background: white;
            border-radius: 20px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.25);
        }

        h1 {
            text-align: center;
            color: #172033;
            font-size: 26px;
        }

        .subtitle {
            text-align: center;
            color: #777;
            line-height: 1.5;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin: 16px 0 7px;
            color: #172033;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #d5dce5;
            border-radius: 10px;
            font-size: 15px;
        }

        input:focus {
            outline: 2px solid #00a8cc;
        }

        button {
            width: 100%;
            margin-top: 22px;
            padding: 13px;
            border: none;
            border-radius: 10px;
            background: #172033;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #00a8cc;
        }

        button:disabled {
            opacity: 0.6;
            cursor: wait;
        }

        #message {
            margin-top: 18px;
            text-align: center;
            line-height: 1.5;
            overflow-wrap: anywhere;
        }

        .back {
            display: block;
            margin-top: 20px;
            text-align: center;
            color: #008bab;
            text-decoration: none;
        }
    </style>
</head>

<body>
    <div class="reset-box">
        <h1>🔐 Reset Password</h1>

        <p class="subtitle">
            Create a new password for your Jihad Website admin account.
        </p>

        <form id="resetForm">
            <label for="password">New Password</label>
            <input
                type="password"
                id="password"
                placeholder="Enter new password"
                minlength="8"
                autocomplete="new-password"
                required
            >

            <label for="confirmPassword">Confirm New Password</label>
            <input
                type="password"
                id="confirmPassword"
                placeholder="Enter password again"
                minlength="8"
                autocomplete="new-password"
                required
            >

            <button type="submit" id="saveButton">
                Save New Password
            </button>
        </form>

        <p id="message" role="status" aria-live="polite"></p>

        <a href="./admin.html" class="back">
            ← Back to Admin Login
        </a>
    </div>

    <script>
        const SUPABASE_URL =
            "https://ylsvipyztljtblfuoxhd.supabase.co";

        const SUPABASE_PUBLISHABLE_KEY =
            "sb_publishable_Gj7-cAMpBFMNJithr1HIhA_ifec4CQW";

        const supabaseClient = window.supabase.createClient(
            SUPABASE_URL,
            SUPABASE_PUBLISHABLE_KEY
        );

        const resetForm = document.getElementById("resetForm");
        const saveButton = document.getElementById("saveButton");
        const message = document.getElementById("message");

        function showMessage(text, color) {
            message.textContent = text;
            message.style.color = color;
        }

        let recoveryReady = false;

        // Detect the password-recovery session from Supabase.
        supabaseClient.auth.onAuthStateChange((event, session) => {
            if (event === "PASSWORD_RECOVERY" && session) {
                recoveryReady = true;
                showMessage(
                    "Reset link verified. Enter your new password.",
                    "green"
                );
            }
        });

        async function checkRecoverySession() {
            try {
                const url = new URL(window.location.href);
                const queryError = url.searchParams.get("error_description");
                const hashParams = new URLSearchParams(
                    url.hash.startsWith("#")
                        ? url.hash.slice(1)
                        : url.hash
                );

                const hashError =
                    hashParams.get("error_description");

                if (queryError || hashError) {
                    showMessage(
                        "Reset link error: " + (queryError || hashError),
                        "red"
                    );
                    return;
                }

                // Supabase may return a recovery code in the URL.
                const code = url.searchParams.get("code");

                if (code) {
                    const { error } =
                        await supabaseClient.auth.exchangeCodeForSession(code);

                    if (error) {
                        showMessage(
                            "The reset link may have expired. Request a new one.",
                            "red"
                        );
                        return;
                    }
                }

                const { data, error } =
                    await supabaseClient.auth.getSession();

                if (error) {
                    showMessage(error.message, "red");
                    return;
                }

                if (data.session) {
                    recoveryReady = true;
                    showMessage(
                        "Session verified. Enter your new password.",
                        "green"
                    );
                } else {
                    showMessage(
                        "Open this page using the latest password-reset email link.",
                        "#b45309"
                    );
                }

            } catch (error) {
                showMessage(
                    "Could not verify the reset link. Request a new link and try again.",
                    "red"
                );
            }
        }

        resetForm.addEventListener("submit", async (event) => {
            event.preventDefault();

            const password =
                document.getElementById("password").value;

            const confirmPassword =
                document.getElementById("confirmPassword").value;

            if (password.length < 8) {
                showMessage(
                    "Password must be at least 8 characters.",
                    "red"
                );
                return;
            }

            if (password !== confirmPassword) {
                showMessage(
                    "The passwords do not match.",
                    "red"
                );
                return;
            }

            saveButton.disabled = true;
            showMessage("Updating password...", "#555");

            try {
                // Re-check the active recovery session.
                const { data: sessionData, error: sessionError } =
                    await supabaseClient.auth.getSession();

                if (sessionError || !sessionData.session) {
                    recoveryReady = false;
                    showMessage(
                        "No valid reset session. Request a new reset email and open its link.",
                        "red"
                    );
                    return;
                }

                const { error } =
                    await supabaseClient.auth.updateUser({
                        password: password
                    });

                if (error) {
                    showMessage(
                        "Could not update password: " + error.message,
                        "red"
                    );
                    return;
                }

                showMessage(
                    "Password changed successfully! You can now log in.",
                    "green"
                );

                resetForm.reset();

                // Sign out the recovery session, then return to login.
                await supabaseClient.auth.signOut();

                setTimeout(() => {
                    window.location.href = "./admin.html";
                }, 2000);

            } catch (error) {
                showMessage(
                    "Network error. Please try again.",
                    "red"
                );
            } finally {
                saveButton.disabled = false;
            }
        });

        checkRecoverySession();
    </script>
</body>
</html>
