<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jihad Website - Admin Login</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #172033, #00a8cc);
        }

        .admin-box {
            width: 100%;
            max-width: 430px;
            padding: 30px;
            background: white;
            border-radius: 20px;
            box-shadow: 0 15px 40px rgba(0,0,0,.25);
        }

        h1 {
            text-align: center;
            color: #172033;
        }

        .subtitle {
            text-align: center;
            color: #777;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin: 15px 0 7px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #d5dce5;
            border-radius: 8px;
            font-size: 15px;
        }

        button {
            width: 100%;
            margin-top: 22px;
            padding: 13px;
            border: none;
            border-radius: 8px;
            background: #172033;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:disabled {
            opacity: .6;
        }

        #message {
            text-align: center;
            overflow-wrap: anywhere;
            line-height: 1.5;
        }

        .back {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #0086a3;
            text-decoration: none;
        }
    </style>
</head>

<body>
    <main class="admin-box">
        <h1>🔐 Admin Login</h1>
        <p class="subtitle">Jihad Website</p>

        <form id="loginForm">
            <label for="email">Email</label>
            <input
                type="email"
                id="email"
                placeholder="Enter admin email"
                autocomplete="username"
                required
            >

            <label for="password">Password</label>
            <input
                type="password"
                id="password"
                placeholder="Enter admin password"
                autocomplete="current-password"
                required
            >

            <button type="submit" id="loginButton">Login</button>
        </form>

        <p id="message" role="status" aria-live="polite"></p>

        <a href="./index.html" class="back">← Back to Website</a>
    </main>

    <script>
        const SUPABASE_URL =
            "https://ylsvipyztljtblfuoxhd.supabase.co";

        const SUPABASE_PUBLISHABLE_KEY =
            "sb_publishable_Gj7-cAMpBFMNJithr1HIhA_ifec4CQW";

        const supabaseClient = window.supabase.createClient(
            SUPABASE_URL,
            SUPABASE_PUBLISHABLE_KEY
        );

        const form = document.getElementById("loginForm");
        const button = document.getElementById("loginButton");
        const message = document.getElementById("message");

        form.addEventListener("submit", async function(event) {
            event.preventDefault();

            const email = document.getElementById("email").value.trim();
            const password = document.getElementById("password").value;

            button.disabled = true;
            message.style.color = "#555";
            message.textContent = "Logging in...";

            try {
                const { data, error } =
                    await supabaseClient.auth.signInWithPassword({
                        email: email,
                        password: password
                    });

                if (error) {
                    message.style.color = "red";
                    message.textContent = error.message;
                    return;
                }

                if (!data.session) {
                    message.style.color = "red";
                    message.textContent = "Login session not found.";
                    return;
                }

                message.style.color = "green";
                message.textContent = "Login successful!";

                setTimeout(function() {
                    window.location.href = "./admin-upload.html";
                }, 1000);

            } catch (error) {
                message.style.color = "red";
                message.textContent =
                    "Connection error. Please check your internet.";
            } finally {
                button.disabled = false;
            }
        });
    </script>
</body>
</html>
